<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= htmlWebpackPlugin.options.title %></title>
</head>
<body>
  <div class="game-container">
    <div class="ship-placement">
      <h2>Choose your ship placement</h2>
      <div class="placement-choices">
        <button>Random</button>
        <button>Manual</button>
      </div>
    </div>
    <div class="boards">
      <div class="player-board-container">
        <h2 class="board-heading">Home Waters</h2>
        <div class="player-board"></div>
      </div>
      <div class="manual-placement">
        <h2>Place your fleet</h2>
        <div class="ship-choices">
          <button class="ship-choice" data-length="5">Carrier</button>
          <button class="ship-choice" data-length="4">Battleship</button>
          <button class="ship-choice" data-length="3">Cruiser</button>
          <button class="ship-choice" data-length="3">Submarine</button>
          <button class="ship-choice" data-length="2">Destroyer</button>
        </div>
      </div>

      <div class="computer-board-container">
        <h2 class="board-heading">Hostile Waters</h2>
        <div class="computer-board"></div>
      </div>
    </div>
    <div class="message-log"><p>Awaiting...</p></div>
  </div>
</body>
</html>
